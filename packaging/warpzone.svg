<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Warpzone</title>
  <defs>
    <linearGradient id="cano" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#3fc463"/>
      <stop offset=".45" stop-color="#2ea24d"/>
      <stop offset=".46" stop-color="#25823f"/>
      <stop offset="1"   stop-color="#1b6431"/>
    </linearGradient>
    <radialGradient id="vortice" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#efe9ff"/>
      <stop offset=".35" stop-color="#c3c3ee"/>
      <stop offset=".75" stop-color="#6d63c9"/>
      <stop offset="1"   stop-color="#241f4a"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#131318"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none"
        stroke="#c3c3ee" stroke-opacity=".28" stroke-width="2"/>

  <!-- pixels soltos: a partícula saindo do warp -->
  <rect x="97" y="24" width="8" height="8" fill="#c3c3ee" fill-opacity=".85"/>
  <rect x="25" y="17" width="6" height="6" fill="#c3c3ee" fill-opacity=".5"/>
  <rect x="86" y="12" width="5" height="5" fill="#c3c3ee" fill-opacity=".35"/>

  <!-- boca do cano: o vórtice que engole a URL -->
  <ellipse cx="64" cy="47" rx="35" ry="15" fill="url(#vortice)"/>
  <ellipse cx="64" cy="47" rx="22" ry="9" fill="#241f4a" fill-opacity=".6"/>
  <ellipse cx="64" cy="47" rx="10" ry="4" fill="#efe9ff" fill-opacity=".92"/>

  <!-- lábio do cano, bloco largo estilo 8-bit -->
  <path d="M29 47h70v22H29z" fill="url(#cano)"/>
  <path d="M29 47h70v4H29z" fill="#7ef0a0" fill-opacity=".5"/>
  <path d="M29 65h70v4H29z" fill="#0e3d1d" fill-opacity=".5"/>

  <!-- corpo do cano -->
  <path d="M40 69h48v39H40z" fill="url(#cano)"/>
  <path d="M40 69h7v39h-7z" fill="#7ef0a0" fill-opacity=".32"/>
  <path d="M81 69h7v39h-7z" fill="#0e3d1d" fill-opacity=".45"/>
</svg>
